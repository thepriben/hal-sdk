<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hal-sdk — HAL open-archive search</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #666;
        --border: #e2e2e2;
        --accent: #7a1f2b;
        --bg: #fbfbfb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        color: var(--fg);
        background: var(--bg);
        line-height: 1.5;
      }
      .app { max-width: 760px; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
      h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
      .subtitle { color: var(--muted); margin: 0.5rem 0 2rem; }
      .search { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
      input[type="search"] {
        flex: 1;
        min-width: 12rem;
        padding: 0.6rem 0.75rem;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
      }
      input[type="search"]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
      select {
        padding: 0.6rem 0.6rem;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--fg);
      }
      select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
      button {
        padding: 0.6rem 1.1rem;
        font-size: 1rem;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:hover { opacity: 0.92; }
      .status { color: var(--muted); min-height: 1.5em; margin: 0 0 1.5rem; }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 0.75rem;
        background: #fff;
      }
      .card h2 { margin: 0 0 0.35rem; font-size: 1.05rem; font-weight: 600; }
      .authors { margin: 0 0 0.35rem; color: var(--fg); }
      .meta { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.85rem; }
      .card a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
      .card a:hover { text-decoration: underline; }
    </style>
  </head>
  <body></body>
</html>
