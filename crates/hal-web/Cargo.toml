[package]
name = "hal-web"
description = "WebAssembly front-end demonstrating hal-sdk running in the browser."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
hal-sdk = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Node",
    "console",
]
