[package]
name = "hal-cli"
description = "Small command-line client demonstrating the hal-sdk crate."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "hal-cli"
path = "src/main.rs"

[dependencies]
hal-sdk = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
