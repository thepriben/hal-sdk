[workspace]
resolver = "2"
members = [
    "crates/hal-sdk",
    "crates/hal-cli",
    "crates/hal-web",
]
# `cargo build` / `cargo test` at the root only build the native crates.
# The WebAssembly front-end (hal-web) is built with `trunk` (see crates/hal-web).
default-members = [
    "crates/hal-sdk",
    "crates/hal-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Benoît Prieur"]
repository = "https://github.com/thepriben/hal-sdk"
homepage = "https://thepriben.github.io/hal-sdk/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hal-sdk = { path = "crates/hal-sdk", version = "0.2.0" }
